server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # APIs en el mismo origen que el frontend: sin CORS (arquitectura-frontend.md, sección 5.12)
    location /api/ {
        proxy_pass http://backend:3000;
    }

    location /ds-api/ {
        proxy_pass http://ds-api:8000/;
    }

    # Evita el 404 al recargar una ruta de Angular
    location / {
        try_files $uri $uri/ /index.html;
    }
}
